<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSec AI – Autonomous Security Dashboard</title>
    <style>
        :root {
            --bg: #0a0e14;
            --surface: #131820;
            --surface2: #1a202c;
            --primary: #00f0ff;
            --accent: #b200ff;
            --success: #00e676;
            --warning: #ffab40;
            --danger: #ff5252;
            --text: #e0e0e0;
            --text-muted: #8892a4;
            --border: #2a3340;
            --radius: 12px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }
        .container { max-width: 1280px; margin:0 auto; padding: 2rem; }
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.5rem 2rem; background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-size: 1.5rem; font-weight: 700; color: var(--primary);
            letter-spacing: -0.5px;
        }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .grid { display: grid; gap: 1.5rem; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.5rem;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: var(--primary); }
        .card-header {
            display: flex; align-items: center; gap: 0.75rem;
            margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .card-header i { font-style: normal; font-size: 1.2rem; }
        .metric {
            font-size: 2.5rem; font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .status-badge {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.3rem 0.8rem; border-radius: 50px; font-weight: 600;
            font-size: 0.85rem;
        }
        .status-pass { background: rgba(0,230,118,0.15); color: var(--success); }
        .status-fail { background: rgba(255,82,82,0.15); color: var(--danger); }
        .status-pending { background: rgba(255,171,64,0.15); color: var(--warning); }
        .btn {
            padding: 0.7rem 1.5rem; border-radius: 8px; border: none;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--bg);
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-outline {
            background: transparent; border: 1px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover { background: rgba(0,240,255,0.1); }
        input, select {
            background: var(--surface2); border: 1px solid var(--border);
            color: var(--text); padding: 0.7rem 1rem; border-radius: 8px;
            width: 100%; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: var(--primary); }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-weight: 500; }
        .fix-item {
            background: var(--surface2); border-radius: 8px; padding: 1rem;
            margin-bottom: 0.75rem; border-left: 3px solid var(--primary);
        }
        .fix-item h4 { margin-bottom: 0.5rem; color: var(--primary); }
        .fix-item p { color: var(--text-muted); font-size: 0.9rem; }
        .progress-bar {
            height: 6px; background: var(--border); border-radius: 3px;
            overflow: hidden; margin-top: 0.75rem;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px; animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; }
        }
        .loading-spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid var(--border); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer {
            margin-top: 3rem; padding: 1.5rem 2rem; text-align: center;
            color: var(--text-muted); border-top: 1px solid var(--border);
        }
        @media (max-width: 768px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">AutoSec<span>AI</span></div>
        <nav class="nav-links">
            <a href="#" class="active">Dashboard</a>
            <a href="#">Scans</a>
            <a href="#">Billing</a>
            <a href="#">Settings</a>
        </nav>
    </header>

    <div class="container">
        <!-- Stats Row -->
        <div class="grid grid-3" style="margin-bottom: 2rem;">
            <div class="card">
                <div class="card-header">🔍 Total Scans</div>
                <div class="metric" id="totalScans">—</div>
            </div>
            <div class="card">
                <div class="card-header">🛡️ Fixes Applied</div>
                <div class="metric" id="fixesApplied">—</div>
            </div>
            <div class="card">
                <div class="card-header">⏱️ Uptime</div>
                <div class="metric" id="uptime">—</div>
            </div>
        </div>

        <!-- Scan Form + Latest Result -->
        <div class="grid grid-2">
            <div class="card">
                <div class="card-header">🔎 Run Security Scan</div>
                <div class="form-group">
                    <label>Website URL</label>
                    <input type="text" id="urlInput" placeholder="https://example.com" value="https://example.com">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="autoApprove" checked> Auto-approve deployment
                    </label>
                </div>
                <button class="btn btn-primary" onclick="startScan()" id="scanBtn">
                    Start Scan
                </button>
                <div id="scanStatus" style="margin-top: 1rem;"></div>
            </div>

            <div class="card">
                <div class="card-header">📊 Latest Scan Result</div>
                <div id="latestResult">
                    <p style="color: var(--text-muted);">No scan results yet. Start a scan to see results.</p>
                </div>
                <div id="loadingArea" style="display:none; margin-top:1rem;">
                    <span class="loading-spinner"></span> Scanning...
                    <div class="progress-bar"><div class="progress-fill" style="width:60%;"></div></div>
                </div>
            </div>
        </div>

        <!-- Fix Plan (populated dynamically) -->
        <div id="fixPlanArea" style="display:none; margin-top: 2rem;">
            <div class="card">
                <div class="card-header">📋 Fix Plan</div>
                <div id="fixPlanContent"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        AutoSec AI – Autonomous Security System &copy; 2026
    </div>

    <script>
        const API_BASE = "https://autonomous-website-security.onrender.com";
        const API_KEY = "autosec-secret-2026";

        // Fetch stats on load
        async function loadStats() {
            try {
                const resp = await fetch(`${API_BASE}/health`);
                if (resp.ok) {
                    document.getElementById('uptime').textContent = '24/7';
                }
            } catch(e) {
                document.getElementById('uptime').textContent = 'Offline';
            }
            // Simulated stats (you can add real endpoints)
            document.getElementById('totalScans').textContent = '24';
            document.getElementById('fixesApplied').textContent = '18';
        }
        loadStats();

        async function startScan() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('Please enter a URL');

            document.getElementById('scanBtn').disabled = true;
            document.getElementById('scanStatus').innerHTML = '<span class="loading-spinner"></span> Starting scan...';
            document.getElementById('latestResult').innerHTML = '';
            document.getElementById('loadingArea').style.display = 'block';
            document.getElementById('fixPlanArea').style.display = 'none';

            try {
                const resp = await fetch(`${API_BASE}/scan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                    body: JSON.stringify({
                        url: url,
                        auto_approve: document.getElementById('autoApprove').checked
                    })
                });
                const data = await resp.json();
                document.getElementById('scanStatus').innerHTML = `✅ Scan started. Job ID: ${data.job_id}`;
                pollResults(data.job_id);
            } catch(e) {
                document.getElementById('scanStatus').innerHTML = `❌ Error: ${e.message}`;
                document.getElementById('scanBtn').disabled = false;
                document.getElementById('loadingArea').style.display = 'none';
            }
        }

        async function pollResults(jobId) {
            const maxAttempts = 15;
            for (let i = 0; i < maxAttempts; i++) {
                await new Promise(r => setTimeout(r, 4000));
                try {
                    const resp = await fetch(`${API_BASE}/results/${jobId}`, {
                        headers: { 'x-api-key': API_KEY }
                    });
                    const result = await resp.json();
                    if (result.status === 'completed') {
                        displayResult(result);
                        document.getElementById('scanBtn').disabled = false;
                        document.getElementById('loadingArea').style.display = 'none';
                        return;
                    } else if (result.status === 'failed') {
                        document.getElementById('latestResult').innerHTML = `<p style="color:var(--danger);">❌ Scan failed: ${result.error || 'Unknown error'}</p>`;
                        document.getElementById('scanBtn').disabled = false;
                        document.getElementById('loadingArea').style.display = 'none';
                        return;
                    }
                } catch(e) {
                    // keep polling
                }
            }
            document.getElementById('latestResult').innerHTML = '<p style="color:var(--warning);">⚠️ Scan timed out. Try again later.</p>';
            document.getElementById('scanBtn').disabled = false;
            document.getElementById('loadingArea').style.display = 'none';
        }

        function displayResult(result) {
            const statusClass = result.qa_status === 'pass' ? 'status-pass' : 'status-fail';
            const deployClass = result.deployment_status === 'deployed' ? 'status-pass' : 
                                result.deployment_status === 'pending_approval' ? 'status-pending' : 'status-fail';

            document.getElementById('latestResult').innerHTML = `
                <div style="display:flex; gap:1rem; margin-bottom:1rem;">
                    <span class="status-badge ${statusClass}">QA: ${result.qa_status.toUpperCase()}</span>
                    <span class="status-badge ${deployClass}">Deploy: ${result.deployment_status.toUpperCase()}</span>
                </div>
                <p><strong>Issues Found:</strong> ${result.issues_found}</p>
                <p><strong>URL:</strong> ${result.url}</p>
                <p style="color:var(--text-muted); font-size:0.9rem;">${result.message}</p>
            `;

            // Show fix plan
            if (result.fix_plan && result.fix_plan.issues) {
                const fixPlanContent = document.getElementById('fixPlanContent');
                fixPlanContent.innerHTML = '';
                result.fix_plan.issues.forEach((issue, idx) => {
                    const steps = issue.steps.map(s => `<li>${s.step || s}</li>`).join('');
                    const estimated = issue.estimated_time || (issue.steps[0] && issue.steps[0].estimated_time) || 'N/A';
                    fixPlanContent.innerHTML += `
                        <div class="fix-item">
                            <h4>${idx+1}. ${issue.recommended_action || issue.issue_type}</h4>
                            <p>Severity: ${issue.issue_type}</p>
                            <p>Estimated time: ${estimated}</p>
                            <ul style="margin-top:0.5rem; padding-left:1.2rem;">${steps}</ul>
                        </div>
                    `;
                });
                document.getElementById('fixPlanArea').style.display = 'block';
            }
        }
    </script>
</body>
</html>
